name: movie_explorer
description: "Movie Explorer application that fetches data from The Movie Database (TMDB) API and allows users to discover and search for movies."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.4.0
  json_annotation: ^4.8.1
  # BLoC dependencies
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:

  uses-material-design: true

  assets:
    - assets/svg/
